<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalStorage and SessionStorage</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <h1>Theme Preference</h1>

    <div class="theme-toggle">
        <label for="theme">Choose Theme:</label>

        <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>

    <div class="storage-buttons">
        <button id="saveLocal">Save to LocalStorage</button>

        <button id="saveSession">Save to SessionStorage</button>

        <button id="clearStorage">Clear Storage</button>
    </div>

    <div class="storage-display">

        <h2>Stored Data</h2>

        <p id="localStorageData">
            LocalStorage:
        </p>

        <p id="sessionStorageData">
            SessionStorage:
        </p>

    </div>

    <script src="index.js"></script>

</body>

<script src="index.js"> </script>
</body>
</html>
