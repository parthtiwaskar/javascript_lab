<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Planner</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="container">
      <h1>Schedule Planner</h1>

      <!-- Input Boxes -->
      <div class="form">
        <input type="text" id="day" placeholder="Enter Day" />

        <input type="text" id="begin" placeholder="Begin Time" />

        <input type="text" id="end" placeholder="End Time" />

        <input type="text" id="topic" placeholder="Enter Topic" />

        <button id="addBtn">Add Schedule</button>
      </div>

      <!-- Schedule Table -->
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Begin</th>
            <th>End</th>
            <th>Topic</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="scheduleBody">
          <!-- Mock Data -->
          <tr>
            <td>Monday</td>
            <td>8:00 AM</td>
            <td>10:00 AM</td>
            <td>HTML Basics</td>
            <td>
              <button onclick="deleteSchedule(0)">Delete</button>
            </td>
          </tr>

          <tr>
            <td>Tuesday</td>
            <td>10:00 AM</td>
            <td>12:00 PM</td>
            <td>CSS Styling</td>
            <td>
              <button onclick="deleteSchedule(1)">Delete</button>
            </td>
          </tr>

          <tr>
            <td>Wednesday</td>
            <td>2:00 PM</td>
            <td>4:00 PM</td>
            <td>JavaScript</td>
            <td>
              <button onclick="deleteSchedule(2)">Delete</button>
            </td>
          </tr>

          <tr>
            <td>Thursday</td>
            <td>9:00 AM</td>
            <td>11:00 AM</td>
            <td>DOM Manipulation</td>
            <td>
              <button onclick="deleteSchedule(3)">Delete</button>
            </td>
          </tr>

          <tr>
            <td>Friday</td>
            <td>11:00 AM</td>
            <td>1:00 PM</td>
            <td>Web Development</td>
            <td>
              <button onclick="deleteSchedule(4)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>

      <button id="clearBtn">Clear Schedule</button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
