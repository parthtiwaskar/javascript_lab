<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Planner</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="container">
      <h1>Schedule Planner</h1>

      <!-- Input Boxes -->
      <div class="form">
        <input type="text" id="day" placeholder="Enter Day" />

        <input type="text" id="begin" placeholder="Begin Time" />

        <input type="text" id="end" placeholder="End Time" />

        <input type="text" id="topic" placeholder="Enter Topic" />

        <button id="addBtn">Add Schedule</button>
      </div>

      <!-- Schedule Table -->
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Begin</th>
            <th>End</th>
            <th>Topic</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="scheduleBody"></tbody>
      </table>

      <button id="storeBtn">Store Session</button>
      <button id="clearBtn">Clear Session</button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
