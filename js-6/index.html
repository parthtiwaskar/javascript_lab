<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Text Validator</title>

    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="container">
      <h1>Text Validator</h1>

      <form id="myForm">
        <!-- Email -->
        <label for="email">Enter Email:</label>
        <input type="text" id="email" placeholder="example@gmail.com" />

        <!-- Phone -->
        <label for="phone">Enter Phone Number:</label>
        <input type="text" id="phone" placeholder="9876543210" />

        <!-- PRN -->
        <label for="prn">Enter PRN:</label>
        <input type="text" id="prn" placeholder="24070521067" />

        <!-- Paragraph -->
        <label for="paragraph">Enter Paragraph:</label>

        <textarea
          id="paragraph"
          rows="8"
          placeholder="Enter a paragraph containing email, phone number and Computer Science..."
        ></textarea>

        <button type="submit">Submit</button>
      </form>

      <!-- Result -->
      <div id="result"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
